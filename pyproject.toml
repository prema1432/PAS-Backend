[project]
name = "pas-backend"
version = "0.1.0"
description = "PAS Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "motor==3.7.0",
    "pymongo==4.11.1",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "python-dotenv==1.0.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
